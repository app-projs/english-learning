plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def versionPropertiesFile = rootProject.file("version.properties")
def versionProperties = new Properties()
if (versionPropertiesFile.exists()) {
    versionPropertiesFile.withInputStream { versionProperties.load(it) }
}

def isPackagingTask = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase()
    normalizedTaskName.contains('assemble') || normalizedTaskName.contains('bundle')
}

def autoVersionCode
if (rootProject.ext.has('autoVersionCode')) {
    autoVersionCode = rootProject.ext.autoVersionCode
} else {
    autoVersionCode = (versionProperties.getProperty('VERSION_CODE') ?: flutter.versionCode.toString()).toInteger()
    if (isPackagingTask) {
        autoVersionCode += 1
        versionProperties.setProperty('VERSION_CODE', autoVersionCode.toString())
        versionPropertiesFile.withOutputStream { versionProperties.store(it, 'Automatically incremented by flutter build') }
    }
    rootProject.ext.autoVersionCode = autoVersionCode
}

def autoVersionName
if (rootProject.ext.has('autoVersionName')) {
    autoVersionName = rootProject.ext.autoVersionName
} else {
    autoVersionName = versionProperties.getProperty('VERSION_NAME') ?: flutter.versionName.toString()
    if (isPackagingTask) {
        def versionParts = autoVersionName.tokenize('.')
        if (versionParts.size() == 3) {
            def nextPatch = versionParts[2].toInteger() + 1
            autoVersionName = "${versionParts[0]}.${versionParts[1]}.${nextPatch}"
            versionProperties.setProperty('VERSION_NAME', autoVersionName)
            versionPropertiesFile.withOutputStream { versionProperties.store(it, 'Automatically incremented by flutter build') }
        }
    }
    rootProject.ext.autoVersionName = autoVersionName
}

android {
    namespace = "com.example.flutter_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
    buildToolsVersion = "34.0.0"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.flutter_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = autoVersionCode
        versionName = autoVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        def versionName = variant.versionName
        def versionCode = variant.versionCode
        variant.outputs.all { output ->
            outputFileName = "lumina-english-v${versionName}.apk"
        }
        variant.assembleProvider.get().doLast {
            copy {
                from "${buildDir}/outputs/apk/${variant.buildType.name}"
                into "${buildDir}/outputs/flutter-apk"
                include "*.apk"
                rename { String fileName ->
                    "lumina-english-v${versionName}.apk"
                }
            }
        }
    }
}

flutter {
    source = "../.."
}
